<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, follow"><title>Amida Maker | Support &amp; Legal</title><link rel="stylesheet" href="styles.css"><link rel="icon" href="images/app_icon.png">
<script>
(() => {
  const languages = navigator.languages && navigator.languages.length
    ? navigator.languages : [navigator.language || 'en'];
  const language = languages.map(value => value.toLowerCase().split(/[-_]/)[0])
    .find(value => ['ja', 'en', 'ko'].includes(value)) || 'en';
  const destination = new URL('./' + language + '/support.html', window.location.href);
  destination.search = window.location.search;
  destination.hash = window.location.hash;
  window.location.replace(destination.href);
})();
</script></head>
