<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Amida Maker</title><link rel="stylesheet" href="marketing.css"><link rel="icon" href="images/app_icon.png"><script>
(() => {
  const available = new Set(["ja", "en", "ko", "zh_Hant", "zh_Hans", "th", "id", "vi", "pt_BR", "ms", "fr"]);
  const match = (value) => {
    const parts = value.toLowerCase().replace(/_/g, '-').split('-');
    const language = parts[0];
    if (language === 'zh') {
      if (parts.includes('hant')) return 'zh_Hant';
      if (parts.includes('hans')) return 'zh_Hans';
      return parts.some(part => ['tw', 'hk', 'mo'].includes(part)) ? 'zh_Hant' : 'zh_Hans';
    }
    if (language === 'pt') return 'pt_BR';
    if (language === 'in') return 'id';
    return language;
  };
  const languages = navigator.languages && navigator.languages.length
    ? navigator.languages : [navigator.language || 'en'];
  const locale = languages.map(match).find(value => available.has(value)) || 'en';
  const destination = new URL('./' + locale + '/landing_page_' + locale + '.html', window.location.href);
  destination.search = window.location.search;
  destination.hash = window.location.hash;
  window.location.replace(destination.href);
})();
</script></head>
