<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>VersaMemo</title>
    <meta http-equiv="refresh" content="0; url=en/">
    <script>
        const destination = navigator.language.toLowerCase().startsWith('ja') ? 'ja/' : 'en/';
        window.location.replace(destination);
    </script>
</head>
<body>
    <p><a href="en/">English</a> / <a href="ja/" lang="ja">日本語</a></p>
</body>
</html>
